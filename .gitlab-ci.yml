stages:
  - test
  - docker

test_project:
  image: python:3.11-slim
  stage: test

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest

  script:
    - pytest -q

docker_build:
  image: docker:27
  stage: docker

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  script:
    - docker build -t ml-ticket-classifier-api .